<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What Needs Me</title><link rel="stylesheet" href="/style.css">
</head>
<body data-density="compact">
  <main>
    <header class="topbar">
      <a class="brand" href="/">what needs me<span>.</span></a>
      <div id="accounts" class="accounts" aria-label="Connected accounts"></div>
      <div class="controls">
        <div class="segmented" role="group" aria-label="View mode">
          <button data-mode="fused" class="active" aria-pressed="true">Fused</button><button data-mode="split" aria-pressed="false">Split</button>
        </div>
        <label class="density">Density <select id="density">
          <option value="zen">Zen</option><option value="compact" selected>Compact</option><option value="dense">Dense</option>
        </select></label>
      </div>
    </header>

    <section class="intro">
      <p class="eyebrow" id="today-label">Today</p>
      <h1>What needs you.</h1>
      <span id="status" role="status">Your priorities, in focus.</span>
    </section>

    <section id="lanes" class="lanes" aria-live="polite" aria-label="Today’s priorities">
      <div class="skeletons" role="status"><span class="sr-only">Loading your priorities</span>
        <div class="skeleton" aria-hidden="true"><i></i><span></span></div>
        <div class="skeleton" aria-hidden="true"><i></i><span></span></div>
        <div class="skeleton" aria-hidden="true"><i></i><span></span></div>
      </div>
    </section>

    <section id="pile" class="pile">
      <button id="pile-toggle" class="pile-head" aria-expanded="false" aria-controls="pile-body">
        <span>
          <span class="eyebrow">The pile</span>
          <span id="pile-headline" class="pile-title">Nothing here needs you</span>
        </span>
        <span id="pile-caret" class="caret">Show breakdown</span>
      </button>
      <div id="pile-body" class="pile-body"></div>
    </section>
  </main>

  <div id="scrim" class="scrim"></div>
  <aside aria-label="Thread details">
  <div id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="thread-title" aria-hidden="true" inert tabindex="-1">
    <button id="close-drawer" class="close" aria-label="Close thread"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <p class="eyebrow">Thread</p>
    <h2 id="thread-title">Loading…</h2>
    <div class="thread-summary-panel">
      <p class="panel-label">Summary</p>
      <p id="thread-summary" class="thread-summary"></p>
      <div id="thread-change-block" class="change-block" hidden>
        <p class="panel-label">What changed</p>
        <p id="thread-change" class="change"></p>
      </div>
    </div>
    <div id="thread-messages"></div>
  </div>

  </aside>

  <script src="/app.js"></script>
</body>
</html>
